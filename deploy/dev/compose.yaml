# SPDX-License-Identifier: Apache-2.0
#
# Local dev stack for the first Eden release.
#
#   cd deploy/dev && docker compose --profile dev up --build
#   cd deploy/dev && docker compose --profile dev down -v
#
# DEV ONLY. Every key is generated into the dev-home volume and is worthless
# outside it. The Celestia chain id is edicta-dev-1 and the Eden chain id is
# 31337. Nothing here talks to a public network at run time.
#
# Starts: genesis-init (one shot), celestia-init (one shot), a one-validator
# Celestia devnet, a bridge node for it, edictad in fast mode, the Eden dev
# chain (ev-reth, ev-node sequencer, in-memory local DA).
#
# Not started yet: the signer, the mock x402 resource, the demo agent and the
# verifier one-shot.

name: edicta-dev

x-dev-root: &dev-root
  # The upstream images run as an unprivileged user that cannot write to a
  # fresh named volume. Dev only.
  user: "0:0"

services:
  genesis-init:
    profiles: [dev]
    build:
      context: ../..
      dockerfile: deploy/dev/Dockerfile
    image: edicta-dev-tools:local
    entrypoint: ["edicta", "dev", "init"]
    command: ["--home", "/dev-home"]
    volumes:
      - dev-home:/dev-home
    restart: "no"

  celestia-init:
    <<: *dev-root
    profiles: [dev]
    image: ghcr.io/celestiaorg/celestia-app:v10.4.0@sha256:d4330125c64132496e7ae41b42b92f163d72cd62372811a3f5676cbaf0fa9afb
    entrypoint: ["/bin/sh", "/scripts/celestia-init.sh"]
    volumes:
      - dev-home:/dev-home:ro
      - celestia-data:/celestia-home
      - ./scripts:/scripts:ro
    depends_on:
      genesis-init:
        condition: service_completed_successfully
    restart: "no"

  celestia:
    <<: *dev-root
    profiles: [dev]
    image: ghcr.io/celestiaorg/celestia-app:v10.4.0@sha256:d4330125c64132496e7ae41b42b92f163d72cd62372811a3f5676cbaf0fa9afb
    command: ["start", "--home", "/celestia-home", "--force-no-bbr"]
    volumes:
      - celestia-data:/celestia-home
    depends_on:
      celestia-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:26657/status | grep -Eq '\"latest_block_height\":\"([3-9]|[1-9][0-9]+)\"'"]
      interval: 3s
      timeout: 5s
      retries: 60
      start_period: 5s
    restart: unless-stopped

  celestia-bridge:
    <<: *dev-root
    profiles: [dev]
    image: ghcr.io/celestiaorg/celestia-node:v0.34.3@sha256:384e7bbab1623e7162a8c1cc623ddc9d288822b5cd41f8ef03e60032d0214e1d
    entrypoint: ["/bin/bash", "/scripts/celestia-bridge.sh"]
    volumes:
      - bridge-data:/bridge-home
      - ./scripts:/scripts:ro
    depends_on:
      celestia:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -sf -X POST -H 'Content-Type: application/json' --data '{\"jsonrpc\":\"2.0\",\"id\":1,\"method\":\"header.LocalHead\",\"params\":[]}' http://127.0.0.1:26658 | jq -e '.result.header.height' >/dev/null"]
      interval: 3s
      timeout: 5s
      retries: 60
      start_period: 10s
    restart: unless-stopped

  edictad:
    profiles: [dev]
    image: edicta-dev-tools:local
    entrypoint: ["edicta", "gate", "serve"]
    command: ["-config", "/dev-home/edictad.toml"]
    volumes:
      - dev-home:/dev-home
    ports:
      - "127.0.0.1:${EDICTAD_PORT:-18480}:8080"
    depends_on:
      genesis-init:
        condition: service_completed_successfully
      celestia-bridge:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/v1/health >/dev/null"]
      interval: 3s
      timeout: 5s
      retries: 40
      start_period: 5s
    restart: unless-stopped

  eden-da:
    profiles: [dev]
    build:
      context: .
      dockerfile: Dockerfile.local-da
    image: edicta-dev-local-da:ev-node-v1.1.4
    command: ["-listen-all"]
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 7980"]
      interval: 3s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  eden-reth:
    profiles: [dev]
    image: ghcr.io/evstack/ev-reth:v0.4.1@sha256:1e3479305284651a162a976a69a15c268f5e5be44526ff4292a0bbc80b24d936
    command:
      - node
      - --chain=/dev-home/genesis/eden-genesis.json
      - --datadir=/data
      - --http
      - --http.addr=0.0.0.0
      - --http.port=8545
      - --http.api=eth,net,web3,txpool,debug
      - --authrpc.addr=0.0.0.0
      - --authrpc.port=8551
      - --authrpc.jwtsecret=/dev-home/genesis/jwt.hex
      - --disable-discovery
      - --engine.persistence-threshold=0
      - --engine.memory-block-buffer-target=0
    volumes:
      - dev-home:/dev-home:ro
      - eden-reth-data:/data
    depends_on:
      genesis-init:
        condition: service_completed_successfully
    ports:
      - "127.0.0.1:${EDEN_RPC_PORT:-18545}:8545"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf -X POST -H 'Content-Type: application/json' --data '{\"jsonrpc\":\"2.0\",\"id\":1,\"method\":\"eth_chainId\",\"params\":[]}' http://127.0.0.1:8545 | grep -q 0x7a69"]
      interval: 3s
      timeout: 5s
      retries: 40
      start_period: 5s
    restart: unless-stopped

  eden-node:
    <<: *dev-root
    profiles: [dev]
    image: ghcr.io/evstack/ev-node-evm:v1.1.4@sha256:bb8bfadc640918db9aca86ced602880ccc06d1d7fe61b12c8d3ee6a6eacd366c
    entrypoint: ["/bin/sh", "/scripts/eden-node.sh"]
    environment:
      EDEN_BLOCK_TIME: ${EDEN_BLOCK_TIME:-100ms}
    volumes:
      - dev-home:/dev-home:ro
      - eden-node-data:/root/.evm
      - ./scripts:/scripts:ro
    depends_on:
      eden-reth:
        condition: service_healthy
      eden-da:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:7331/health/live >/dev/null"]
      interval: 3s
      timeout: 5s
      retries: 40
      start_period: 15s
    restart: unless-stopped

volumes:
  dev-home:
  celestia-data:
  bridge-data:
  eden-reth-data:
  eden-node-data:
